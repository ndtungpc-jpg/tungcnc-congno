</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#102b45"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#102b45"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"></head><body><header><div><b>TÙNG GIANG CNC</b><small>Sổ công nợ · An toàn dữ liệu 2.0.6</small></div></header><main class="wrap"><div class="toolbar"><nav class="tabs"><button data-tab="dashboard" class="active" onclick="tab('dashboard')">Tổng quan</button><button data-tab="customers" onclick="tab('customers')">Khách hàng</button><button data-tab="suppliers" onclick="tab('suppliers')">Nhà cung cấp</button><button data-tab="orders" onclick="tab('orders')">Đơn hàng</button><button data-tab="payments" onclick="tab('payments')">Thu / Chi</button><button data-tab="trash" onclick="tab('trash')">Thùng rác</button><button data-tab="audit" onclick="tab('audit')">Nhật ký</button><button data-tab="settings" onclick="tab('settings')">Quản lý dữ liệu</button></nav><div class="actions"><button class="btn primary" onclick="formOrder()">+ Đơn khách</button><button class="btn" onclick="formSupplierOrder()">+ Nhập nợ NCC</button><button class="btn primary" onclick="formCustomerReceipt()">+ Thu khách</button><button class="btn" onclick="formSupplierPay()">+ Trả NCC</button></div></div><section id="updateNotice" role="status" style="display:none;background:#e8f3ff;color:#153a5c;border:1px solid #9fc6e8;padding:12px;border-radius:10px;margin:10px 0">Có phiên bản ứng dụng mới. <button class="btn primary" onclick="applyAppUpdate()">Cập nhật giao diện</button> <button class="btn" onclick="document.getElementById('updateNotice').style.display='none'">Để sau</button><div class="muted">Dữ liệu công nợ trên thiết bị không bị xóa.</div></section><section id="storageNotice" style="display:none;background:#fff1c7;color:#6d4700;border:1px solid #dfc88a;padding:12px;border-radius:10px;margin:10px 0"></section><section id="content"></section></main><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><div id="toast"></div><input id="importFile" class="file" type="file" accept="application/json,.json" onchange="importData(event)"><script src="./safety.js"></script><script src="./recovery.js"></script><script src="./excel.js"></script><script>
'use strict';const DBNAME='tunggiang-congno-v2',STORE='state';const MIGRATION={partners:[],orders:[],payments:[]};let db,state={partners:[],orders:[],payments:[]},current='dashboard',filter='';const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('vi-VN').format(Math.round(Number(n)||0))+'đ',today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},date=s=>s?new Date(s+'T00:00:00').toLocaleDateString('vi-VN'):'—',id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Math.max(0,Number(v)||0),partner=i=>state.partners.find(x=>x.id===i),order=i=>state.orders.find(x=>x.id===i),paid=i=>state.payments.filter(x=>x.orderId===i).reduce((a,x)=>a+x.amount,0),balance=o=>o.cancelled?0:o.amount-paid(o.id),due=o=>balance(o)>0&&o.due&&o.due<today(),total=(type)=>state.orders.filter(o=>partner(o.partnerId)?.type===type).reduce((a,o)=>a+balance(o),0);
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2600)}
let storageMode='indexeddb';
const STORAGE_KEY='tunggiang-congno-offline-v2';
function showStorageNotice(message){const el=document.getElementById('storageNotice');el.style.display='block';el.textContent=message}
let committed=null,saving=false,ready=false;
const deviceId=id();
async function init(){
 try{
  db=await new Promise((resolve,reject)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('Bộ nhớ bị khóa'))});
 }catch(err){db=null;storageMode='localstorage';showStorageNotice('IndexedDB chưa sẵn sàng. Đang dùng kho dự phòng riêng; không tự gộp dữ liệu. Hãy kiểm tra số dư và sao lưu JSON. '+err.message)}
 if(db){
  const raw=await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const g=tx.objectStore(STORE).get('main');g.onsuccess=()=>resolve(g.result);g.onerror=()=>reject(g.error)});
  state=TGSafety.normalize(raw||MIGRATION);
  db.onversionchange=()=>{db.close();ready=false;showStorageNotice('Kho dữ liệu thay đổi. Hãy tải lại ứng dụng.')};
 }else{
  let raw;
  try{const probe='__tg_probe__';localStorage.setItem(probe,'1');localStorage.removeItem(probe);raw=localStorage.getItem(STORAGE_KEY)}
  catch(err){storageMode='memory';raw=null;showStorageNotice('Không có bộ nhớ bền vững. Chỉ xem dữ liệu; thao tác ghi bị chặn.')}
  state=TGSafety.normalize(raw?JSON.parse(raw):MIGRATION);
 }
 committed=structuredClone(state);ready=true;if(!recordCount(state))showStorageNotice('Kho hiện tại chưa có bản ghi. Vào Quản lý dữ liệu → Tìm dữ liệu cũ / Kho trước cập nhật để kiểm tra kho cũ, kho dự phòng và các bản phục hồi.');
 const warnings=TGSafety.issues(state);if(warnings.length)showStorageNotice('Dữ liệu cũ cần đối chiếu (chưa tự sửa số dư): '+warnings.join('; '));
}
function matchesStored(raw){try{return JSON.stringify(TGSafety.normalize(raw||MIGRATION))===JSON.stringify(committed)}catch{return false}}
async function save(candidate){
 if(storageMode==='indexeddb')return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,'readwrite'),store=tx.objectStore(STORE),g=store.get('main');let conflict=false;
  g.onsuccess=()=>{if((g.result?.revision||0)!==committed.revision||!matchesStored(g.result)){conflict=true;tx.abort();return}store.put(candidate,'main')};
  tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||Error('Không thể lưu'));tx.onabort=()=>reject(Error(conflict?'Cửa sổ khác đã cập nhật dữ liệu. Hãy tải lại trước khi sửa.':'Ghi dữ liệu bị hủy'));
 });
 if(storageMode==='localstorage'){
  if(!navigator.locks)throw Error('Kho dự phòng cần trình duyệt hỗ trợ khóa ghi. Hãy dùng bản HTTPS hoặc xuất JSON.');
  return navigator.locks.request(STORAGE_KEY,()=>{const raw=localStorage.getItem(STORAGE_KEY);if((raw?JSON.parse(raw).revision||0:0)!==committed.revision)throw Error('Cửa sổ khác đã cập nhật. Hãy tải lại.');localStorage.setItem(STORAGE_KEY,JSON.stringify(candidate))});
 }
 throw Error('Không có bộ nhớ lưu bền vững.');
}
async function commit(action='edit'){
 if(saving||!ready)return false;saving=true;
 try{
  const candidate=TGSafety.normalize(state),at=new Date().toISOString();
  if(action!=='import')candidate.audit.push(...TGSafety.changes(committed,candidate,{id,at,device:deviceId}));
  if(action==='import')candidate.audit.push({id:id(),at,device:deviceId,action:'import',kind:'backup',recordId:'',before:null,after:{summary:'Nhập / phục hồi JSON',partners:candidate.partners.length,orders:candidate.orders.length,payments:candidate.payments.length}});
  const oldIssues=new Set(TGSafety.issues(committed));const newIssues=TGSafety.issues(candidate).filter(x=>!oldIssues.has(x));if(newIssues.length)throw Error(newIssues.join('; '));
  candidate.revision=committed.revision+1;await save(candidate);
  state=candidate;committed=structuredClone(candidate);render();toast('Đã lưu trên thiết bị này');return true;
 }catch(err){state=structuredClone(committed);render();alert('Chưa lưu thay đổi; dữ liệu trước đó được giữ nguyên. '+err.message);return false}
 finally{saving=false}
}
document.addEventListener('click',e=>{if(saving||!ready){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('submit',e=>{if(saving||!ready){e.preventDefault();e.stopImmediatePropagation()}},true);
window.addEventListener('beforeunload',e=>{if(saving){e.preventDefault();e.returnValue=''}});

function tab(t){current=t;selectedCustomer=null;filter='';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${head.length}" class="empty">Chưa có dữ liệu</td></tr>`}</tbody></table></div>`}
function render(){let html='';if(current==='recovery-search')html=recoverySearchView();if(current==='trash')html=trashView();if(current==='audit')html=auditView();if(current==='dashboard'){const receivable=total('customer'),payable=total('supplier'),overdue=state.orders.filter(o=>partner(o.partnerId)?.type==='customer'&&due(o)).reduce((a,o)=>a+balance(o),0),received=state.payments.filter(p=>!String(p.id).startsWith('legacy-')&&p.date?.slice(0,7)===today().slice(0,7)&&partner(order(p.orderId)?.partnerId)?.type==='customer').reduce((a,p)=>a+p.amount,0);html=`<div class="grid"><button class="stat clickable" onclick="tab('collections')"><span>Khách còn nợ ›</span><strong>${money(receivable)}</strong></button><button class="stat clickable" onclick="tab('supplier-debts')"><span>Nợ nhà cung cấp ›</span><strong>${money(payable)}</strong></button><button class="stat clickable" onclick="tab('received-month')"><span>Đã thu tháng này ›</span><strong class="green">${money(received)}</strong></button><button class="stat clickable" onclick="tab('overdue')"><span>Khách nợ quá hạn ›</span><strong class="red">${money(overdue)}</strong></button></div><div class="panel"><div class="split"><h2>Lịch sử cập nhật gần nhất</h2><span class="muted">Đơn hàng và thu / chi mới nhất</span></div>${recentActivity()}</div>`}
if(current==='collections'){html=collectionView()}
if(current==='customer-detail'){html=customerDetailView(selectedCustomer)}
if(current==='customers'||current==='suppliers'){const typ=current==='customers'?'customer':'supplier',ps=state.partners.filter(p=>p.type===typ);html=`<div class="panel"><div class="split"><h2>${typ==='customer'?'Khách hàng':'Nhà cung cấp'} (${ps.length})</h2><div class="actions"><input class="search" placeholder="Tìm tên..." value="${esc(filter)}" oninput="search(this.value)"><button class="btn primary" onclick="formPartner('', '${jsid(typ)}')">+ Thêm</button></div></div>${table(['Tên','Số điện thoại','Công nợ','Thao tác'],ps.filter(p=>(p.name+' '+p.phone).toLowerCase().includes(filter.toLowerCase())).map(p=>`<tr><td><button class="customer-link" onclick="${typ==='customer'?`openCustomer('${jsid(p.id)}')`:`openSupplier('${jsid(p.id)}')`}">${esc(p.name)}</button></td><td>${esc(p.phone)}</td><td><b>${money(state.orders.filter(o=>o.partnerId===p.id).reduce((a,o)=>a+balance(o),0))}</b></td><td><button class="smallbtn" onclick="formPartner('${jsid(p.id)}')">Sửa</button><button class="smallbtn danger" onclick="removePartner('${jsid(p.id)}')">Xóa</button></td></tr>`).join(''))}</div>`}
if(current==='supplier-debts'){html=supplierListView()}
if(current==='supplier-detail'){html=supplierDetailView(selectedCustomer)}
if(current==='received-month'){const ps=state.payments.filter(p=>!String(p.id).startsWith('legacy-')&&p.date?.slice(0,7)===today().slice(0,7)&&partner(order(p.orderId)?.partnerId)?.type==='customer').sort((a,b)=>b.date.localeCompare(a.date));html=`<div class="panel"><div class="split"><h2>Đã thu tháng ${today().slice(0,7)}</h2><button class="btn" onclick="tab('dashboard')">← Tổng quan</button></div>${table(['Khách hàng','Ngày','Đơn hàng','Số tiền'],ps.map(p=>{const o=order(p.orderId),pt=partner(o?.partnerId);return `<tr><td><button class="customer-link" onclick="openCustomer('${jsid(pt.id)}')">${esc(pt.name)}</button></td><td>${date(p.date)}</td><td>${esc(o?.title)}</td><td>${money(p.amount)}</td></tr>`}).join(''))}</div>`}
if(current==='overdue'){const os=state.orders.filter(o=>partner(o.partnerId)?.type==='customer'&&due(o)).sort((a,b)=>a.due.localeCompare(b.due));html=`<div class="panel"><div class="split"><h2>Khách nợ quá hạn (${os.length} đơn)</h2><button class="btn" onclick="tab('dashboard')">← Tổng quan</button></div>${table(['Khách hàng','Hạn thanh toán','Đơn','Còn nợ'],os.map(o=>`<tr><td><button class="customer-link" onclick="openCustomer('${jsid(o.partnerId)}')">${esc(partner(o.partnerId)?.name)}</button></td><td>${date(o.due)}</td><td>${esc(o.title)}</td><td class="red">${money(balance(o))}</td></tr>`).join(''))}<p class="hint">Đơn chưa có hạn thanh toán không được tự coi là quá hạn.</p></div>`}

/div></div>`;

function exportCustomerImage(pid,mode){
 const pt=partner(pid);if(!pt)return alert('Không tìm thấy khách hàng');
 const all=state.orders.filter(o=>o.partnerId===pid&&!o.cancelled).sort((a,b)=>(a.created||'').localeCompare(b.created||''));
 const rows=mode==='debt'?all.filter(o=>balance(o)>0):all;
 const debt=mode==='debt',title=debt?'BẢNG ĐỐI CHIẾU CÔNG NỢ':'BẢNG THỐNG KÊ ĐƠN HÀNG';
 const w=1600,pad=45,rowH=56,top=206,headH=54,bottom=top+headH+Math.max(rows.length,1)*rowH,h=bottom+132;
 if(h>30000)return alert('Danh sách quá dài để xuất một ảnh. Vui lòng xuất Excel.');
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');
 if(!c)return alert('Trình duyệt không hỗ trợ xuất ảnh');
 c.fillStyle='#fff';c.fillRect(0,0,w,h);
 const txt=(v,x,y,size=20,bold=false,color='#27313b',max=1000,align='left')=>{c.font=(bold?'bold ':'')+size+'px Arial,sans-serif';c.fillStyle=color;c.textAlign=align;c.fillText(String(v??''),x,y,max);c.textAlign='left'};
 const line=y=>{c.strokeStyle='#dce2e7';c.beginPath();c.moveTo(pad,y+.5);c.lineTo(w-pad,y+.5);c.stroke()};
 const amt=v=>v==null||v===''?'—':money(v);
 c.fillStyle='#343c45';c.fillRect(0,0,w,10);
 txt('TÙNG GIANG CNC',pad,51,25,true);
 txt(title,pad,101,32,true);
 txt('Khách hàng: '+pt.name,pad,145,23,true,'#303b45',w-2*pad);
 txt('Ngày lập: '+date(today()),pad,180,18,false,'#65717d');
 // Right-aligned numeric columns, no order code and no status column.
 const cols=debt?[
  ['STT',pad+12,'left',60],['Ngày',pad+92,'left',120],['Hạng mục',pad+235,'left',355],
  ['Khối lượng',pad+685,'right',145],['ĐVT',pad+710,'left',75],['Đơn giá',pad+1050,'right',170],
  ['Thành tiền',pad+1220,'right',160],['Đã trả',pad+1375,'right',150],['Còn nợ',w-pad-12,'right',150]
 ]:[
  ['STT',pad+12,'left',60],['Ngày',pad+94,'left',120],['Hạng mục',pad+242,'left',540],
  ['Khối lượng',pad+950,'right',155],['ĐVT',pad+984,'left',100],['Đơn giá',pad+1270,'right',190],
  ['Thành tiền',w-pad-12,'right',205]
 ];
 // Debt layout has tighter columns: use dedicated coordinates for legibility.
 if(debt){
  cols[2][3]=350;cols[3][1]=835;cols[3][3]=115;cols[4][1]=858;
  cols[5][1]=1065;cols[5][3]=145;cols[6][1]=1235;cols[6][3]=155;
  cols[7][1]=1390;cols[7][3]=135;cols[8][3]=145;
 }
 c.fillStyle='#edf1f4';c.fillRect(pad,top,w-pad*2,headH);
 cols.forEach(col=>txt(col[0],col[1],top+35,18,true,'#26323d',col[3],col[2]));
 if(!rows.length)txt('Không có đơn hàng phù hợp',pad+12,top+headH+37,20);
 rows.forEach((o,i)=>{
  const y=top+headH+i*rowH;
  if(i%2){c.fillStyle='#f7f9fb';c.fillRect(pad,y,w-pad*2,rowH)}
  const vals=debt?[i+1,date(o.created),o.title||'—',o.basisQuantity??o.quantity??null,o.unit||'—',amt(o.unitPrice),money(o.amount),money(paid(o.id)),money(balance(o))]:[i+1,date(o.created),o.title||'—',o.basisQuantity??o.quantity??null,o.unit||'—',amt(o.unitPrice),money(o.amount)];
  vals.forEach((v,j)=>txt(v==null?'—':v,cols[j][1],y+36,18,j===vals.length-1,'#303b45',cols[j][3],cols[j][2]));
  line(y+rowH);
 });
 line(bottom+7);
 txt(debt?'TỔNG CÒN NỢ':'TỔNG GIÁ TRỊ ĐƠN HÀNG',pad,bottom+54,23,true);
 txt(money(rows.reduce((sum,o)=>sum+(debt?balance(o):o.amount),0)),w-pad,bottom+54,28,true,'#26323d',450,'right');
 if(!debt)txt('Tổng còn nợ: '+money(rows.reduce((sum,o)=>sum+balance(o),0)),w-pad,bottom+87,19,false,'#65717d',550,'right');
 txt('Tùng Giang CNC · Bảng thông tin gửi khách hàng',pad,h-20,16,false,'#77838d');
 cv.toBlob(blob=>{

  const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title}).catch(e=>{if(e.name!=='AbortError')download(name,blob,'image/png')});
  else download(name,blob,'image/png');
 },'image/png');
}

align-items:center;gap:8px} .btn:focus-visible,.stat:focus-visible{outline:3px solid #5c9ed0}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#102b45"><meta name="mobile-web-app-capable" content="yes"></head><body><b>TÙNG GIANG CNC</b><h1>BẢNG ĐỐI CHIẾU CÔNG NỢ</h1><p><b>Khách hàng:</b> ${esc(p.name)}</p><p><b>Ngày đối chiếu:</b> ${date(today())}</p><table><thead><tr><th>STT</th><th>Ngày đơn</th><th>Mã đơn</th><th>Nội dung</th><th>Giá trị</th><th>Đã trả</th><th>Còn nợ</th></tr></thead><tbody>${tr}</tbody></table><div class="total"><b>TỔNG CÒN NỢ: ${money(sum)}</b></div><p class="footnote">Kính đề nghị quý khách đối chiếu và xác nhận số dư. Nếu có sai lệch, vui lòng phản hồi để kiểm tra.</p></body></html>`;const w=window.open('','_blank');if(!w){alert('Trình duyệt đang chặn cửa sổ in. Hãy cho phép mở cửa sổ bật lên.');return;}w.document.open();w.document.write(doc);w.document.close();w.focus();setTimeout(()=>w.print(),350)}
function ordersTable(arr){return table(['Mã / Hạng mục','Đối tác',...orderDetailHeaders(),'Giá trị','Đã thanh toán','Còn lại / Hạn','Thao tác'],arr.map(o=>`<tr><td><b>${esc(o.code)}</b><div class="muted">${esc(o.title)} ${o.cancelled?"(ĐÃ HỦY) ":""}${o.risk==="bad"?"⚠ Nợ khó thu hồi":""}</div></td><td>${esc(partner(o.partnerId)?.name||'—')}</td>${orderDetailCells(o)}<td>${money(o.amount)}</td><td>${money(paid(o.id))}</td><td><b class="${due(o)?'red':''}">${money(balance(o))}</b><div class="muted">${date(o.due)} ${due(o)?'· QUÁ HẠN':''}</div></td><td><button class="smallbtn" onclick="formPayment(null,'${jsid(o.id)}')">${partner(o.partnerId)?.type==='supplier'?'Chi':'Thu'}</button><button class="smallbtn" onclick="formOrder('${jsid(o.id)}')">Sửa</button><button class="smallbtn danger" onclick="removeOrder('${jsid(o.id)}')">Xóa</button><button class="smallbtn" onclick="cancelOrder('${jsid(o.id)}')">${o.cancelled?'Đã hủy':'Hủy đơn'}</button></td></tr>`).join(''))}

function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}

async function submitPartner(e,pid){e.preventDefault();const f=new FormData(e.target),p={...(pid?partner(pid):{}),id:pid||id(),name:f.get('name').trim(),type:f.get('type'),phone:f.get('phone').trim(),note:f.get('note').trim()};if(pid&&partner(pid).type!==p.type&&state.orders.some(o=>o.partnerId===pid))return alert('Đối tác có đơn; không được đổi loại khách/NCC.');if(pid)state.partners=state.partners.map(x=>x.id===pid?p:x);else state.partners.push(p);closeModal();await commit()}

function getOrCreatePartner(name,type){const n=normalizeName(name);let p=state.partners.find(p=>p.type===type&&normalizeName(p.name)===n);if(!p){p={id:id(),name:name.trim(),type,phone:'',note:'Tạo tự động khi nhập đơn/giao dịch'};state.partners.push(p)}return p}

function showMultiOrders(){

 const os=state.orders.filter(o=>o.partnerId===pid&&balance(o)>0).sort((a,b)=>(a.created||'9999').localeCompare(b.created||'9999'));

async function submitMultiPayment(e){
 e.preventDefault();
 const f=new FormData(e.target), pid=$('#multiCustomer').value, amt=Number(f.get('amount'));
 if(!Number.isFinite(amt)||amt<=0)return alert('Số tiền không hợp lệ');
 const ids=f.getAll('allocOrder'), os=ids.map(order).filter(o=>o&&o.partnerId===pid&&balance(o)>0).sort((a,b)=>(a.created||'9999').localeCompare(b.created||'9999'));
 const available=os.reduce((a,o)=>a+balance(o),0);
 if(amt>available+0.001)return alert('Số tiền vượt tổng nợ các đơn đã chọn: '+money(available));
 if(!os.length)return alert('Chọn ít nhất một đơn');
 let left=amt, count=0, batch=id();
 for(const o of os){if(left<=0.001)break;const v=Math.min(left,balance(o));state.payments.push({id:id(),orderId:o.id,date:f.get('date'),amount:Math.round(v*100)/100,method:f.get('method'),note:(f.get('note')||'')+' · Phân bổ '+batch,updatedAt:new Date().toISOString()});left-=v;count++}
 closeModal();if(await commit())toast('Đã phân bổ thu tiền vào '+count+' đơn');
}

 const file=e.target.files[0];if(!file)return;
 try{
  if(file.size>50*1024*1024)throw Error('Tệp lớn hơn 50 MB');
  const v=JSON.parse((await file.text()).replace(/^\uFEFF/,''));if(v.app==='TungGiang-CongNo-Details')return await importOrderDetails(v);if(v.app!=='TungGiang-CongNo'||![1,2].includes(v.version))throw Error('Sai định dạng/phiên bản sao lưu');
  const imported=TGSafety.normalize(v.data);if(!recordCount(imported)&&!imported.trash.length&&!imported.recovery.some(r=>recordCount(r.data)||r.data.trash?.length))throw Error('Tệp sao lưu có 0 đối tác, 0 đơn, 0 thu/chi và không có bản phục hồi chứa dữ liệu. Tệp này không thể lấy lại công nợ.');
  if(!confirm('Nhập JSON sẽ thay dữ liệu đang hoạt động. Ứng dụng giữ bản phục hồi trước nhập. Tiếp tục?'))return;
  const recovery=structuredClone(committed);delete recovery.recovery;
  imported.revision=committed.revision;
  const recoveryIds=new Set(committed.recovery.map(r=>r.id));imported.recovery=[...committed.recovery,...imported.recovery.filter(r=>!recoveryIds.has(r.id)),{id:id(),at:new Date().toISOString(),data:recovery}];
  const auditIds=new Set(committed.audit.map(a=>a.id));
  imported.audit=[...committed.audit,...imported.audit.filter(a=>!auditIds.has(a.id))];
  state=imported;if(await commit('import'))toast('Đã nhập; bản trước nhập nằm trong Quản lý dữ liệu');
 }catch(err){alert('Không thể nhập: '+err.message)}finally{e.target.value=''}
}
async function restoreRecovery(rid){
 const r=state.recovery.find(x=>x.id===rid);if(!r)return;
 if(!confirm('Quay về dữ liệu trước lần nhập này? Dữ liệu hiện tại cũng được giữ làm bản phục hồi.'))return;
 const previous=structuredClone(committed);delete previous.recovery;
 try{const restored=TGSafety.normalize(r.data);restored.recovery=[...state.recovery,{id:id(),at:new Date().toISOString(),data:previous}];restored.audit=structuredClone(state.audit);restored.revision=state.revision;state=restored;await commit('import')}catch(err){alert('Không thể phục hồi: '+err.message)}
}

let auditLimit=100,auditFilter='activity';
function auditIsLegacy(a){return /^legacy[-_]/i.test(String(a.recordId||''))||/^legacy[-_]/i.test(String(a.before?.id||a.after?.id||''))}
function auditRows(){
 const all=state.audit||[];
 // Các bản nhập cũ thường ghi hàng trăm bản ghi cùng thời điểm với sự kiện nhập JSON.
 const imports=new Set(all.filter(a=>a.action==='import').map(a=>a.at));
 const legacy=all.filter(a=>auditIsLegacy(a));
 const batches=new Map();
 for(const a of all){if(a.action==='import')continue;if(!auditIsLegacy(a)&&!imports.has(a.at))continue;
  const key=a.at||'unknown';if(!batches.has(key))batches.set(key,[]);batches.get(key).push(a);
 }
 const suppressed=new Set([...batches.values()].flat().map(a=>a.id));
 const synthetic=[...batches].filter(([at,items])=>!all.some(a=>a.action==='import'&&a.at===at)).map(([at,items])=>({id:'summary:'+at,at,action:'import',kind:'backup',recordId:'',before:null,after:{summary:'Dữ liệu nhập cũ',records:items.length},synthetic:true}));
 const visible=all.filter(a=>!suppressed.has(a.id)).concat(synthetic);
 return visible.filter(a=>auditFilter==='all'||(auditFilter==='imports'?a.action==='import':a.action!=='import')).sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
}

function auditDetail(aid){const a=state.audit.find(x=>x.id===aid)||auditRows().find(x=>x.id===aid);if(!a)return;modal('Chi tiết thay đổi',`<p>Mã phiên: ${esc(a.device||'Không có')}</p><h3>Trước</h3><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(a.before,null,2))}</pre><h3>Sau</h3><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(a.after,null,2))}</pre><button class="btn" onclick="closeModal()">Đóng</button>`)}
function safetySettings(){const warnings=TGSafety.issues(state);return `<div class="panel"><h2>Kiểm tra và phục hồi</h2><p>Chế độ lưu: <b>${esc(storageMode)}</b>. Phiên bản dữ liệu: 2. Lần ghi: ${state.revision}.</p><p>${warnings.length?esc(warnings.join('; ')):'Không phát hiện đơn vượt thanh toán, đơn hủy có thanh toán hoặc trùng mã đơn.'}</p><p class="hint">Bản sao JSON 2.0 chứa cả thùng rác, nhật ký và các bản trước nhập. JSON cũ phiên bản 1 vẫn nhập được. Không dùng bản ứng dụng cũ để sửa dữ liệu 2.0.</p>${table(['Trước lần nhập','Thao tác'],[...state.recovery].reverse().map(r=>`<tr><td>${esc(new Date(r.at).toLocaleString('vi-VN'))}</td><td><button class="smallbtn" onclick="restoreRecovery('${jsid(r.id)}')">Phục hồi bản này</button></td></tr>`).join(''))}</div><div class="panel"><h2>Đồng bộ 2–3 thiết bị</h2><p>Chưa kích hoạt. Bản này chỉ lưu trên thiết bị; chưa có kết nối hay chuyển dữ liệu lên Supabase. Xem tài liệu thiết kế đi kèm trước khi triển khai thử.</p></div>`}

async function importOrderDetails(v){
 if(v.version!==1||!Array.isArray(v.entries)||!v.entries.length)throw Error('Tệp bổ sung chi tiết không hợp lệ');
 if(!state.orders.length)throw Error('Hãy khôi phục dữ liệu công nợ trước khi bổ sung chi tiết.');
 const fields=['unit','unitPrice','quantity','widthMm','heightMm','basisQuantity','material','sourceDetail'],seen=new Set(),updates=[],conflicts=[];let missing=0;
 for(const e of v.entries){
  if(!e||typeof e.id!=='string'||seen.has(e.id))throw Error('Mã đơn trống hoặc trùng trong tệp chi tiết');seen.add(e.id);
  if(!Number.isInteger(e.legacyLine)||e.legacyLine<1||typeof e.expectedTitle!=='string'||typeof e.expectedAmount!=='number'||!Number.isFinite(e.expectedAmount))throw Error('Thiếu thông tin đối chiếu đơn nguồn');
  const o=order(e.id);if(!o){missing++;continue}
  if(o.legacyLine!==e.legacyLine||o.title!==e.expectedTitle||Math.abs(o.amount-e.expectedAmount)>0.000001){conflicts.push(o.code||o.id);continue}
  if((o.unit&&o.unit!==e.unit)||(o.unitPrice!=null&&o.unitPrice!==e.unitPrice)){conflicts.push(o.code||o.id);continue}
  const next={...o};for(const key of fields)next[key]=structuredClone(e[key]??null);if(next.unit==null)next.unit='';if(next.material==null)next.material='';
  if(JSON.stringify(next)!==JSON.stringify(o))updates.push(next);
 }
 if(conflicts.length)throw Error('Có '+conflicts.length+' đơn đã khác bản nguồn hoặc có ĐVT/đơn giá riêng: '+conflicts.slice(0,8).join(', ')+'. Hãy xuất JSON hiện tại để đối chiếu; chưa bổ sung dòng nào.');
 if(!updates.length)return alert('Không có chi tiết mới cần bổ sung.'+(missing?' Có '+missing+' đơn nguồn không nằm trong danh sách hiện tại.':''));
 const candidate=structuredClone(state),byId=new Map(updates.map(o=>[o.id,o]));candidate.orders=candidate.orders.map(o=>byId.get(o.id)||o);TGSafety.validate(candidate);
 if(!confirm('Bổ sung chi tiết cho '+updates.length+' đơn; đơn giá theo VNĐ. Giữ nguyên đối tác, số tiền đơn, thanh toán và số dư. '+(missing?'Bỏ qua '+missing+' mã không còn trong danh sách. ':'')+'Lưu bản trước bổ sung để phục hồi. Tiếp tục?'))return;
 const previous=structuredClone(committed);delete previous.recovery;candidate.recovery.push({id:id(),at:new Date().toISOString(),data:previous});state=candidate;
 if(await commit('detail-import'))toast('Đã bổ sung chi tiết; công nợ được giữ nguyên');
}

let waitingAppWorker=null;
function showAppUpdate(worker){waitingAppWorker=worker;document.getElementById('updateNotice').style.display='block'}
function applyAppUpdate(){
 if(typeof saving!=='undefined'&&saving){alert('Đang lưu dữ liệu. Vui lòng thử lại sau.');return}
 if(waitingAppWorker){waitingAppWorker.postMessage({type:'SKIP_WAITING'});return}
 location.reload();
}
if('serviceWorker' in navigator&&location.protocol==='https:'){
 let reloading=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloading){reloading=true;location.reload()}});
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
  if(reg.waiting&&navigator.serviceWorker.controller)showAppUpdate(reg.waiting);
  reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showAppUpdate(w)})});
  const check=()=>{if(document.visibilityState==='visible')reg.update().catch(console.warn)};
  document.addEventListener('visibilitychange',check);
  setInterval(check,15*60*1000);
 }).catch(console.warn);
}
