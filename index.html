function exportCustomerImage(pid,mode){
 const pt=partner(pid);if(!pt)return alert('Không tìm thấy khách hàng');
 const all=state.orders.filter(o=>o.partnerId===pid&&!o.cancelled).sort((a,b)=>(a.created||'').localeCompare(b.created||''));
 const debt=mode==='debt',rows=debt?all.filter(o=>balance(o)>0):all;
 const title=debt?'BẢNG ĐỐI CHIẾU CÔNG NỢ':'BẢNG THỐNG KÊ ĐƠN HÀNG';
 const w=2000,pad=55,top=255,headH=76,rowH=82;
 const bottom=top+headH+Math.max(rows.length,1)*rowH,h=bottom+175;
 if(h>30000)return alert('Danh sách quá dài để xuất một ảnh. Vui lòng xuất Excel.');
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;
 const c=cv.getContext('2d');if(!c)return alert('Trình duyệt không hỗ trợ xuất ảnh');
 c.fillStyle='#ffffff';c.fillRect(0,0,w,h);
 const text=(v,x,y,size=25,bold=false,color='#263442',max=1000,align='left')=>{
  c.font=(bold?'700 ':'400 ')+size+'px Arial,sans-serif';
  c.fillStyle=color;c.textAlign=align;c.fillText(String(v??''),x,y,max);c.textAlign='left';
 };
 const rule=(y,strong=false)=>{
  c.strokeStyle=strong?'#a5b4c2':'#e1e7ed';c.lineWidth=strong?2:1;
  c.beginPath();c.moveTo(pad,y+.5);c.lineTo(w-pad,y+.5);c.stroke();c.lineWidth=1;
 };
 const amount=v=>v==null||v===''?'':money(v);
 const quantity=o=>{const v=o.basisQuantity??o.quantity;return v==null||v===''||Number(v)===0?'':String(v)};
 const unit=o=>{const v=String(o.unit??'').trim();return v==='-'||v==='—'?'':v};
 const displayQuantityUnit=o=>{const q=quantity(o);if(!q)return '';let u=unit(o);if(/^m\s*(dài|dai|d|đ)$/i.test(u)||/^mét\s*dài$/i.test(u))u='md';if(/^m2$/i.test(u))u='m²';return new Intl.NumberFormat('vi-VN',{maximumFractionDigits:6}).format(Number(q))+(u?' '+u:'')};
 const widths=debt?[72,164,435,235,215,250,235,284]:[72,174,595,290,295,464];
 const headers=debt?['STT','Ngày','Hạng mục','Khối lượng/ĐVT','Đơn giá','Thành tiền','Đã trả','Còn nợ']:['STT','Ngày','Hạng mục','Khối lượng/ĐVT','Đơn giá','Thành tiền'];
 const rightCols=new Set(debt?[3,4,5,6,7]:[3,4,5]);
 const xPositions=[];let pos=pad;
 widths.forEach(v=>{xPositions.push(pos);pos+=v});
 const cell=(v,j,y,bold=false)=>{
  const x=xPositions[j],width=widths[j],right=rightCols.has(j);
  const max=width-18;
  const size=debt?23:25;
  if(j===2){
   const value=String(v??'');
   c.font='400 '+size+'px Arial,sans-serif';
   if(c.measureText(value).width>max){
    const words=value.split(/\s+/);let a='',b='';
    for(const word of words){
     const candidate=a?a+' '+word:word;
     if(!a||c.measureText(candidate).width<=max)a=candidate;
     else b=b?b+' '+word:word;
    }
    text(a,x+9,y+30,size,false,'#263442',max);
    if(b)text(b,x+9,y+60,size,false,'#263442',max);
    return;
   }
  }
  text(v,right?x+width-10:x+9,y+49,size,bold,'#263442',max,right?'right':'left');
 };
 c.fillStyle='#263c52';c.fillRect(0,0,w,12);
 text('TÙNG GIANG CNC',pad,63,32,true,'#263c52');
 text(title,pad,119,43,true,'#172d42');
 text('Khách hàng: '+pt.name,pad,173,32,true,'#263442',w-2*pad);
 text('Ngày lập: '+date(today()),pad,215,25,false,'#637488');
 c.fillStyle='#eaf0f5';c.fillRect(pad,top,w-2*pad,headH);
 headers.forEach((label,j)=>text(label,rightCols.has(j)?xPositions[j]+widths[j]-10:xPositions[j]+9,top+47,23,true,'#263442',widths[j]-18,rightCols.has(j)?'right':'left'));
 if(!rows.length)text('Không có đơn hàng phù hợp',pad+12,top+headH+49,26);
 rows.forEach((o,i)=>{
  const y=top+headH+i*rowH;
  const newDate=i===0||String(o.created||'')!==String(rows[i-1].created||'');
  if(i%2){c.fillStyle='#f8fafc';c.fillRect(pad,y,w-2*pad,rowH)}
  if(i>0&&newDate)rule(y,true);
  const vals=debt?
   [i+1,newDate?date(o.created):'',o.title||'',displayQuantityUnit(o),amount(o.unitPrice),money(o.amount),money(paid(o.id)),money(balance(o))]:
   [i+1,newDate?date(o.created):'',o.title||'',displayQuantityUnit(o),amount(o.unitPrice),money(o.amount)];
  vals.forEach((v,j)=>cell(v,j,y,j===vals.length-1));
  rule(y+rowH);
 });
 rule(bottom+15,true);
 text(debt?'TỔNG CÒN NỢ':'TỔNG GIÁ TRỊ ĐƠN HÀNG',pad,bottom+70,30,true);
 text(money(rows.reduce((sum,o)=>sum+(debt?balance(o):o.amount),0)),w-pad,bottom+70,36,true,'#172d42',620,'right');
 if(!debt)text('Tổng còn nợ: '+money(rows.reduce((sum,o)=>sum+balance(o),0)),w-pad,bottom+113,26,false,'#637488',700,'right');
 text('Tùng Giang CNC · Thông tin gửi khách hàng',pad,h-22,21,false,'#788797');
 cv.toBlob(blob=>{
  if(!blob)return alert('Không tạo được ảnh');
  const name=(debt?'DoiChieuCongNo_':'ThongKeDonHang_')+pt.name.replace(/[^\p{L}\p{N}_-]+/gu,'_')+'_'+today()+'.png';
  const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title}).catch(e=>{if(e.name!=='AbortError')download(name,blob,'image/png')});
  else download(name,blob,'image/png');

async function applyBackupFile(e){
 const file=e.target.files[0];if(!file)return;
 try{
  if(file.size>50*1024*1024)throw Error('Tệp lớn hơn 50 MB');
  const v=JSON.parse((await file.text()).replace(/^\uFEFF/,''));if(v.app==='TungGiang-CongNo-Details')return await importOrderDetails(v);if(v.app!=='TungGiang-CongNo'||![1,2].includes(v.version))throw Error('Sai định dạng/phiên bản sao lưu');
  const checked=TGBackupCheck.parseBackup(v);if(checked.errors.length)throw Error(checked.errors.join('; '));const imported=checked.data;if(!recordCount(imported)&&!imported.trash.length&&!imported.recovery.some(r=>recordCount(r.data)||r.data.trash?.length))throw Error('Tệp sao lưu có 0 đối tác, 0 đơn, 0 thu/chi và không có bản phục hồi chứa dữ liệu. Tệp này không thể lấy lại công nợ.');
  const checkFile=await TGBackupCheck.hashFile(file);if(!pendingBackupRestore||pendingBackupRestore.hash!==checkFile||pendingBackupRestore.snapshot!==JSON.stringify(committed))throw Error('Cần xem trước và xác nhận lại bản sao');
  const recovery=structuredClone(committed);delete recovery.recovery;
  imported.revision=committed.revision;
  const recoveryIds=new Set(committed.recovery.map(r=>r.id));imported.recovery=[...committed.recovery,...imported.recovery.filter(r=>!recoveryIds.has(r.id)),{id:id(),at:new Date().toISOString(),data:recovery}];
  const auditIds=new Set(committed.audit.map(a=>a.id));
  imported.audit=[...committed.audit,...imported.audit.filter(a=>!auditIds.has(a.id))];
  state=imported;if(await commit('import')){closeModal(true);pendingBackupRestore=null;toast('Đã nhập; bản trước nhập nằm trong Quản lý dữ liệu')}
 }catch(err){alert('Không thể nhập: '+err.message)}finally{e.target.value=''}
}

let auditLimit=100,auditFilter='activity';
function auditRows(mode=auditFilter){
 const all=state.audit||[], groups=new Map(),hidden=new Set(),summaries=new Map();
 const mark=(a,label)=>{
  if(hidden.has(a.id))return;
  hidden.add(a.id);
  const key=String(a.at||'')+'|'+label;
  if(!summaries.has(key))summaries.set(key,{at:a.at,label,records:0});
  summaries.get(key).records++;
 };
 for(const a of all){
  if(a.action==='import')continue;
  const key=String(a.at||'')+'|'+String(a.action||'');
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(a);
 }
 for(const items of groups.values()){
  if(items.length<20)continue;
  const imported=items.filter(a=>/^legacy[-_]/i.test(String(a.recordId||a.after?.id||a.before?.id||'')));
  if(imported.length>=20&&imported.length/items.length>=0.8)
   for(const a of imported)mark(a,'Nhập dữ liệu Excel/JSON cũ');
 }
 for(const a of all){
  if(a.action!=='import'&&(a.preparedFile===true||a.device==='chuẩn hóa tệp'))
   mark(a,'Chuẩn hóa dữ liệu cũ');
 }
 const synthetic=[...summaries.entries()].map(([key,v])=>({
  id:'summary:'+key,at:v.at,action:'import',kind:'backup',recordId:'',
  before:null,after:{summary:v.label,records:v.records},synthetic:true
 }));
 const visible=all.filter(a=>!hidden.has(a.id)).concat(synthetic);
 return visible.filter(a=>mode==='all'||(mode==='imports'?a.action==='import':a.action!=='import'))
  .sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
}

function excelKey(x){return String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]/g,'')}
function excelDate(v){
 if(typeof v==='number'){if(!Number.isFinite(v)||v<1||v>2958465)return '';return TGExcelImport.serialDate(Math.floor(v))}
 const s=String(v||'').trim();let y,m,d;
 const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})$/),local=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
 if(iso)[y,m,d]=iso.slice(1).map(Number);else if(local)[d,m,y]=local.slice(1).map(Number);else return '';
 const date=new Date(Date.UTC(y,m-1,d));return date.getUTCFullYear()===y&&date.getUTCMonth()===m-1&&date.getUTCDate()===d?date.toISOString().slice(0,10):'';
}

function excelSimilarName(a,b){

 if(a.includes(b)||b.includes(a))return true;
 let row=Array.from({length:b.length+1},(_,i)=>i);
 for(let i=1;i<=a.length;i++){const next=[i];for(let j=1;j<=b.length;j++)next[j]=Math.min(next[j-1]+1,row[j]+1,row[j-1]+(a[i-1]===b[j-1]?0:1));row=next}
 return row[b.length]<=Math.max(1,Math.floor(Math.max(a.length,b.length)*0.15));
}

async function checkAppVersion(){

  const response=await fetch('/version.json?t='+Date.now(),{cache:'no-store'});

  if(info.version&&info.version!==APP_VERSION){
   remoteAppVersion=info.version;

   notice.firstChild.textContent='Có phiên bản mới '+info.version+'. ';
   notice.style.display='block';
  }else if(info.version===APP_VERSION){
   remoteAppVersion=null;
   if(!waitingAppWorker)document.getElementById('updateNotice').style.display='none';
  }

 finally{versionCheckBusy=false}
}

  if(reg.waiting&&navigator.serviceWorker.controller)showAppUpdate(reg.waiting);
  reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showAppUpdate(w)})});
  const check=()=>{if(document.visibilityState==='visible')reg.update().catch(console.warn)};
  document.addEventListener('visibilitychange',check);

 }).catch(console.warn);
}
