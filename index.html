<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tùng Giang CNC | Sổ công nợ</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#172435;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#102b45;color:white;padding:18px max(16px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font-size:19px}header small{display:block;color:#b5c9da;margin-top:3px}.wrap{max-width:1120px;margin:auto;padding:18px 14px 60px}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button,.btn{border:1px solid #d5deea;background:white;border-radius:10px;padding:10px 13px;color:#21364b}.tabs button.active,.primary{background:#1263a5!important;color:white!important;border-color:#1263a5!important}.danger{color:#b33131!important}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat,.panel{background:white;border:1px solid #e3e8ef;border-radius:14px;padding:16px}.stat span{color:#637184;font-size:13px}.stat strong{display:block;font-size:clamp(17px,2vw,24px);margin-top:8px;overflow-wrap:anywhere}.panel{margin-top:15px}.panel h2{font-size:17px;margin:0 0 14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#718093;font-size:13px}.red{color:#b82f3b}.green{color:#13765d}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:610px}th,td{text-align:left;border-bottom:1px solid #edf0f4;padding:12px 8px;font-size:14px}th{font-size:12px;color:#667588;background:#f8fafc}td:last-child{text-align:right}th:last-child{text-align:right}.right{text-align:right}.pill{font-size:12px;background:#e9f2ff;border-radius:30px;padding:4px 8px;color:#255b88;white-space:nowrap}.search{width:min(100%,340px);border:1px solid #d4deeb;border-radius:10px;padding:10px 12px}.empty{text-align:center;padding:36px;color:#7a8796}.modal{position:fixed;inset:0;background:#0c1a2b9c;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.modal.open{display:flex}.dialog{width:min(100%,550px);max-height:94vh;overflow:auto;background:white;border-radius:16px;padding:20px;box-shadow:0 20px 70px #0004}.dialog h2{margin:0 0 16px;font-size:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#526276}.field.wide{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d3dce8;border-radius:9px;color:#172435;background:white}.field textarea{min-height:75px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hint{font-size:12px;color:#748294;margin-top:10px}.split{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.file{display:none}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17344f;color:white;padding:12px 18px;border-radius:10px;display:none;z-index:20}.smallbtn{border:1px solid #dce3ed;background:#fff;border-radius:8px;padding:6px 9px;font-size:12px;margin:2px}.warn{background:#fff7e7;color:#8a6019;border:1px solid #f0d9a3;padding:11px 13px;border-radius:10px;font-size:13px;margin-top:14px}@media(max-width:720px){header{padding:14px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat,.panel{padding:13px}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.tabs button{padding:9px 11px;font-size:13px}.wrap{padding:12px 10px 40px}header b{font-size:16px}}
.customer-link{border:0;background:transparent;color:#1263a5;font-weight:700;text-align:left;padding:4px 0;text-decoration:underline;text-underline-offset:3px}.customer-link:hover{color:#0b426f}.detail-grid{margin-top:16px}@media(max-width:650px){.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}.stat.clickable{cursor:pointer;text-align:left;width:100%;font:inherit}.stat.clickable:hover{border-color:#1263a5;box-shadow:0 2px 10px #1263a51c}.suggest{display:block;width:100%;max-height:180px;overflow:auto;border:1px solid #d4deeb;border-radius:9px;background:#fff}.suggest button{display:block;width:100%;text-align:left;background:#fff;border:0;padding:10px;border-bottom:1px solid #eee}.suggest button:hover{background:#eaf4ff}.compactrow{padding:8px 0;border-bottom:1px solid #edf0f4}.sectionheading{display:flex;justify-content:space-between;align-items:center;gap:8px} .btn:focus-visible,.stat:focus-visible{outline:3px solid #5c9ed0}</style><link rel="manifest" href="./manifest.webmanifest"></head><body><header><div><b>TÙNG GIANG CNC</b><small>Sổ công nợ · Bản HTTPS</small></div></header><main class="wrap"><div class="toolbar"><nav class="tabs"><button data-tab="dashboard" class="active" onclick="tab('dashboard')">Tổng quan</button><button data-tab="collections" onclick="tab('collections')">Đối chiếu & Thu nợ</button><button data-tab="customers" onclick="tab('customers')">Khách hàng</button><button data-tab="suppliers" onclick="tab('suppliers')">Nhà cung cấp</button><button data-tab="orders" onclick="tab('orders')">Đơn hàng</button><button data-tab="payments" onclick="tab('payments')">Thu / Chi</button><button data-tab="settings" onclick="tab('settings')">Quản lý dữ liệu</button></nav><div class="actions"><button class="btn primary" onclick="formOrder()">+ Đơn khách</button><button class="btn" onclick="formSupplierOrder()">+ Nhập nợ NCC</button><button class="btn primary" onclick="formCustomerReceipt()">+ Thu khách</button><button class="btn" onclick="formSupplierPay()">+ Trả NCC</button></div></div><section id="storageNotice" style="display:none;background:#fff1c7;color:#6d4700;border:1px solid #dfc88a;padding:12px;border-radius:10px;margin:10px 0"></section><section id="content"></section></main><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><div id="toast"></div><input id="importFile" class="file" type="file" accept="application/json,.json" onchange="importData(event)"><script>
'use strict';const DBNAME='tunggiang-congno-v2',STORE='state';const MIGRATION={partners:[],orders:[],payments:[]};let db,state={partners:[],orders:[],payments:[]},current='dashboard',filter='';const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('vi-VN').format(Math.round(Number(n)||0))+'đ',today=()=>new Date().toLocaleDateString('en-CA'),date=s=>s?new Date(s+'T00:00:00').toLocaleDateString('vi-VN'):'—',id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Math.max(0,Number(v)||0),partner=i=>state.partners.find(x=>x.id===i),order=i=>state.orders.find(x=>x.id===i),paid=i=>state.payments.filter(x=>x.orderId===i).reduce((a,x)=>a+x.amount,0),balance=o=>o.cancelled?0:o.amount-paid(o.id),due=o=>balance(o)>0&&o.due&&o.due<today(),total=(type)=>state.orders.filter(o=>partner(o.partnerId)?.type===type).reduce((a,o)=>a+balance(o),0);
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2600)}
let storageMode='indexeddb';
const STORAGE_KEY='tunggiang-congno-offline-v2';
function showStorageNotice(message){const el=document.getElementById('storageNotice');el.style.display='block';el.textContent=message}
async function init(){
 try{
  if(!('indexedDB' in window))throw Error('IndexedDB không được hỗ trợ');
  await new Promise((resolve,reject)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>{db=r.result;const tx=db.transaction(STORE,'readonly');const get=tx.objectStore(STORE).get('main');get.onsuccess=()=>{state=get.result||structuredClone(MIGRATION);resolve()};get.onerror=()=>reject(get.error)};r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('Bộ nhớ bị khóa'))});
  storageMode='indexeddb';return;
 }catch(err){console.warn('IndexedDB unavailable:',err)}
 try{
  const probe='__tg_probe__';localStorage.setItem(probe,'1');localStorage.removeItem(probe);
  const saved=localStorage.getItem(STORAGE_KEY);state=saved?JSON.parse(saved):structuredClone(MIGRATION);
  storageMode='localstorage';showStorageNotice('Chế độ Offline: đang lưu trên bộ nhớ trình duyệt. Hãy sao lưu JSON sau mỗi ngày làm việc; xóa dữ liệu trình duyệt có thể làm mất công nợ.');return;
 }catch(err){console.warn('Local storage unavailable:',err)}
 storageMode='memory';state=structuredClone(MIGRATION);
 showStorageNotice('CẢNH BÁO: Trình duyệt không cho phép lưu dữ liệu. Thay đổi chỉ tồn tại trong phiên mở này. BẮT BUỘC xuất JSON trước khi đóng ứng dụng. Để lưu bền vững trên Android, sử dụng bản HTTPS đã cài hoặc ứng dụng có cơ sở dữ liệu riêng.');
}
async function save(){
 if(storageMode==='indexeddb')return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(state,'main');t.oncomplete=resolve;t.onerror=()=>reject(t.error)});
 if(storageMode==='localstorage'){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return}catch(err){storageMode='memory';showStorageNotice('Không thể ghi bộ nhớ: '+err.message+'. Hãy xuất JSON NGAY để không mất dữ liệu.');throw err}}
 throw Error('Không có bộ nhớ lưu bền vững. Hãy xuất JSON trước khi thoát.');
}
async function commit(){
 try{await save();render();toast('Đã lưu trên thiết bị này')}
 catch(err){render();alert('Dữ liệu chưa lưu bền vững! Hãy vào Quản lý dữ liệu → Sao lưu JSON ngay. '+err.message)}
}
function tab(t){current=t;selectedCustomer=null;filter='';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${head.length}" class="empty">Chưa có dữ liệu</td></tr>`}</tbody></table></div>`}
function render(){let html='';if(current==='dashboard'){const receivable=total('customer'),payable=total('supplier'),overdue=state.orders.filter(o=>partner(o.partnerId)?.type==='customer'&&due(o)).reduce((a,o)=>a+balance(o),0),received=state.payments.filter(p=>p.date?.slice(0,7)===today().slice(0,7)&&partner(order(p.orderId)?.partnerId)?.type==='customer').reduce((a,p)=>a+p.amount,0);html=`<div class="grid"><button class="stat clickable" onclick="tab('collections')"><span>Khách còn nợ ›</span><strong>${money(receivable)}</strong></button><button class="stat clickable" onclick="tab('supplier-debts')"><span>Nợ nhà cung cấp ›</span><strong>${money(payable)}</strong></button><button class="stat clickable" onclick="tab('received-month')"><span>Đã thu tháng này ›</span><strong class="green">${money(received)}</strong></button><button class="stat clickable" onclick="tab('overdue')"><span>Khách nợ quá hạn ›</span><strong class="red">${money(overdue)}</strong></button></div><div class="panel"><div class="split"><h2>Lịch sử cập nhật gần nhất</h2><span class="muted">Đơn hàng và thu / chi mới nhất</span></div>${recentActivity()}</div>`}
if(current==='collections'){html=collectionView()}
if(current==='customer-detail'){html=customerDetailView(selectedCustomer)}
if(current==='customers'||current==='suppliers'){const typ=current==='customers'?'customer':'supplier',ps=state.partners.filter(p=>p.type===typ);html=`<div class="panel"><div class="split"><h2>${typ==='customer'?'Khách hàng':'Nhà cung cấp'} (${ps.length})</h2><div class="actions"><input class="search" placeholder="Tìm tên..." value="${esc(filter)}" oninput="search(this.value)"><button class="btn primary" onclick="formPartner('', '${typ}')">+ Thêm</button></div></div>${table(['Tên','Số điện thoại','Công nợ','Thao tác'],ps.filter(p=>(p.name+' '+p.phone).toLowerCase().includes(filter.toLowerCase())).map(p=>`<tr><td><button class="customer-link" onclick="${typ==='customer'?`openCustomer('${p.id}')`:`openSupplier('${p.id}')`}">${esc(p.name)}</button></td><td>${esc(p.phone)}</td><td><b>${money(state.orders.filter(o=>o.partnerId===p.id).reduce((a,o)=>a+balance(o),0))}</b></td><td><button class="smallbtn" onclick="formPartner('${p.id}')">Sửa</button><button class="smallbtn danger" onclick="removePartner('${p.id}')">Xóa</button></td></tr>`).join(''))}</div>`}
if(current==='supplier-debts'){html=supplierListView()}
if(current==='supplier-detail'){html=supplierDetailView(selectedCustomer)}
if(current==='received-month'){const ps=state.payments.filter(p=>p.date?.slice(0,7)===today().slice(0,7)&&partner(order(p.orderId)?.partnerId)?.type==='customer').sort((a,b)=>b.date.localeCompare(a.date));html=`<div class="panel"><div class="split"><h2>Đã thu tháng ${today().slice(0,7)}</h2><button class="btn" onclick="tab('dashboard')">← Tổng quan</button></div>${table(['Khách hàng','Ngày','Đơn hàng','Số tiền'],ps.map(p=>{const o=order(p.orderId),pt=partner(o?.partnerId);return `<tr><td><button class="customer-link" onclick="openCustomer('${pt.id}')">${esc(pt.name)}</button></td><td>${date(p.date)}</td><td>${esc(o?.title)}</td><td>${money(p.amount)}</td></tr>`}).join(''))}</div>`}
if(current==='overdue'){const os=state.orders.filter(o=>partner(o.partnerId)?.type==='customer'&&due(o)).sort((a,b)=>a.due.localeCompare(b.due));html=`<div class="panel"><div class="split"><h2>Khách nợ quá hạn (${os.length} đơn)</h2><button class="btn" onclick="tab('dashboard')">← Tổng quan</button></div>${table(['Khách hàng','Hạn thanh toán','Đơn','Còn nợ'],os.map(o=>`<tr><td><button class="customer-link" onclick="openCustomer('${o.partnerId}')">${esc(partner(o.partnerId)?.name)}</button></td><td>${date(o.due)}</td><td>${esc(o.title)}</td><td class="red">${money(balance(o))}</td></tr>`).join(''))}<p class="hint">Đơn chưa có hạn thanh toán không được tự coi là quá hạn.</p></div>`}
if(current==='orders'){html=`<div class="panel"><div class="split"><h2>Danh sách đơn hàng (${state.orders.length})</h2><input class="search" placeholder="Tìm mã đơn, tên khách..." value="${esc(filter)}" oninput="search(this.value)"></div>${ordersTable(state.orders.filter(o=>(o.code+' '+o.title+' '+(partner(o.partnerId)?.name||'')).toLowerCase().includes(filter.toLowerCase())))}</div>`}
if(current==='payments'){const ps=[...state.payments].sort((a,b)=>b.date.localeCompare(a.date));html=`<div class="panel"><h2>Lịch sử thu / chi (${ps.length})</h2>${table(['Ngày','Đối tác / Đơn','Hình thức','Số tiền','Thao tác'],ps.map(p=>{const o=order(p.orderId),pt=partner(o?.partnerId);return `<tr><td>${date(p.date)}</td><td><b>${esc(pt?.name||'Đã xóa')}</b><div class="muted">${esc(o?.code)} · ${esc(p.note)}</div></td><td>${esc(p.method)}</td><td class="${pt?.type==='customer'?'green':'red'}"><b>${pt?.type==='customer'?'+':'−'}${money(p.amount)}</b></td><td><button class="smallbtn" onclick="formPayment('${p.id}')">Sửa</button><button class="smallbtn danger" onclick="removePayment('${p.id}')">Xóa</button></td></tr>`}).join(''))}</div>`}
if(current==='settings'){html=`<div class="panel"><h2>Lưu trữ và sao lưu dữ liệu</h2><p>Dữ liệu được lưu bằng <b>IndexedDB trên trình duyệt của thiết bị này</b>, vẫn tồn tại sau khi đóng ứng dụng và có thể dùng ngoại tuyến. Không tự đồng bộ giữa các thiết bị.</p><div class="actions"><button class="btn primary" onclick="exportData()">Xuất bản sao JSON</button><button class="btn" onclick="$('#importFile').click()">Khôi phục từ JSON</button><button class="btn" onclick="exportCSV()">Xuất công nợ CSV</button></div><div class="warn"><b>Quan trọng:</b> Xóa dữ liệu trình duyệt, dùng chế độ ẩn danh hoặc đổi thiết bị có thể làm mất dữ liệu. Hãy xuất bản sao JSON định kỳ và lưu lên Google Drive hoặc nơi an toàn. Nhập bản sao sẽ thay thế toàn bộ dữ liệu hiện tại.</div><p class="muted">Hiện có ${state.partners.length} đối tác, ${state.orders.length} đơn hàng, ${state.payments.length} giao dịch. Không có dữ liệu mẫu tự động.</p></div>`}$('#content').innerHTML=html}
function debtCustomers(){return state.partners.filter(p=>p.type==='customer').map(p=>({...p,open:state.orders.filter(o=>o.partnerId===p.id&&balance(o)>0)})).filter(p=>p.open.length).sort((a,b)=>b.open.reduce((t,o)=>t+balance(o),0)-a.open.reduce((t,o)=>t+balance(o),0))}
let selectedCustomer=null;
function openCustomer(pid){selectedCustomer=pid;current='customer-detail';filter='';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='collections'));render()}
function orderActions(o){const locked=state.payments.some(p=>p.orderId===o.id);return `<div class="actions" style="flex-wrap:wrap"><button class="smallbtn" onclick="${partner(o.partnerId)?.type==='supplier'?`formEditSupplierOrder('${o.id}')`:`formOrder('${o.id}')`}" ${o.cancelled?'disabled':''}>Sửa</button><button class="smallbtn" onclick="cancelOrder('${o.id}')" ${o.cancelled||locked?'disabled':''}>${o.cancelled?'Đã hủy':'Hủy'}</button><button class="smallbtn danger" onclick="removeOrder('${o.id}')" ${locked?'disabled':''}>Xóa</button></div>`}
function customerDetailView(pid){
 const p=partner(pid);if(!p)return '<div class="panel">Không tìm thấy khách hàng.</div>';
 const os=state.orders.filter(o=>o.partnerId===pid).sort((a,b)=>(a.created||'9999').localeCompare(b.created||'9999'));
 const open=os.filter(o=>balance(o)>0),sum=open.reduce((a,o)=>a+balance(o),0),bad=open.filter(o=>o.risk==='bad').reduce((a,o)=>a+balance(o),0);
 return `<div class="panel"><div class="split"><div><button class="btn" onclick="tab('collections')">← Danh sách khách còn nợ</button><h2 style="margin-top:16px">${esc(p.name)}</h2><div class="muted">${open.length} đơn còn nợ · ${os.length} đơn tất cả</div></div><div class="actions"><button class="btn" onclick="exportStatement('${pid}')">Xuất Excel (CSV)</button><button class="btn primary" onclick="printStatement('${pid}')">In / Lưu PDF</button></div></div><div class="grid detail-grid"><div class="stat"><span>Tổng còn nợ</span><strong>${money(sum)}</strong></div><div class="stat"><span>Nợ khó thu hồi</span><strong>${money(bad)}</strong></div><div class="stat"><span>Số đơn còn nợ</span><strong>${open.length}</strong></div><div class="stat"><span>Đã trả các đơn</span><strong>${money(os.reduce((a,o)=>a+paid(o.id),0))}</strong></div></div><div class="split" style="margin-top:18px"><h2>Tất cả đơn hàng của khách</h2><div class="actions"><button class="btn" onclick="statement('${pid}')">Xem bảng kê gửi khách</button><button class="btn" onclick="formMultiPaymentFor('${pid}')">+ Ghi nhận thu tiền</button></div></div>${table(['Ngày đơn','Mã đơn / Nội dung','Giá trị đơn','Đã thanh toán','Còn nợ','Thao tác'],os.map(o=>`<tr><td>${date(o.created)}</td><td><b>${esc(o.code)}</b><div class="muted">${esc(o.title)} ${o.cancelled?"(ĐÃ HỦY) ":""}${o.risk==='bad'?'⚠ Nợ khó thu hồi':''}</div></td><td>${money(o.amount)}</td><td>${money(paid(o.id))}</td><td><b>${money(balance(o))}</b></td><td><button class="smallbtn" onclick="formPayment(null,'${o.id}')" ${o.cancelled||balance(o)<=0?'disabled':''}>Thu tiền</button>${orderActions(o)}</td></tr>`).join(''))}<div class="hint">Danh sách này hiển thị cả đơn đã thanh toán và đã hủy; bảng kê gửi khách chỉ gồm đơn còn nợ.</div></div>`;
}
function formMultiPaymentFor(pid){formMultiPayment();const select=$('#multiCustomer');if(select){select.value=pid;showMultiOrders()}}
function collectionView(){const ps=debtCustomers(),sum=ps.reduce((a,p)=>a+p.open.reduce((t,o)=>t+balance(o),0),0);return `<div class="panel"><div class="split"><div><h2>Danh sách khách còn nợ</h2><div class="muted">${ps.length} khách · ${money(sum)} · chỉ tính đơn còn dư nợ</div></div><div class="actions"><button class="btn" onclick="exportDebtCustomers()">Xuất danh sách CSV</button><input class="search" placeholder="Tìm khách còn nợ..." value="${esc(filter)}" oninput="search(this.value)"></div></div>${table(['Khách hàng','Số đơn','Tổng còn nợ','Trong đó nợ khó thu hồi','Bảng kê'],ps.filter(p=>(p.name+' '+(p.phone||'')).toLowerCase().includes(filter.toLowerCase())).map(p=>`<tr><td><button class="customer-link" onclick="openCustomer('${p.id}')">${esc(p.name)}</button></td><td>${p.open.length}</td><td><b>${money(p.open.reduce((a,o)=>a+balance(o),0))}</b></td><td>${money(p.open.filter(o=>o.risk==='bad').reduce((a,o)=>a+balance(o),0))}</td><td><button class="smallbtn" onclick="statement('${p.id}')">Xem / Xuất</button></td></tr>`).join(''))}</div>`}
function csvFile(name,rows){const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download(name,csv,'text/csv;charset=utf-8')}
function exportDebtCustomers(){const ps=debtCustomers();csvFile('TungGiang_DanhSachKhachConNo_'+today()+'.csv',[['Khách hàng','Số đơn còn nợ','Tổng còn nợ','Nợ khó thu hồi'],...ps.map(p=>[p.name,p.open.length,p.open.reduce((a,o)=>a+balance(o),0),p.open.filter(o=>o.risk==='bad').reduce((a,o)=>a+balance(o),0)])]);}
function statement(pid){const p=partner(pid);if(!p)return;const os=state.orders.filter(o=>o.partnerId===pid&&balance(o)>0).sort((a,b)=>(a.created||'').localeCompare(b.created||''));const sum=os.reduce((a,o)=>a+balance(o),0);modal('Bảng kê công nợ · '+p.name,`<div class="muted">TÙNG GIANG CNC · Ngày đối chiếu: ${date(today())}</div><p><b>Khách hàng: ${esc(p.name)}</b></p><div class="tablewrap">${table(['Ngày','Mã đơn / Nội dung','Tổng tiền','Đã trả','Còn nợ'],os.map(o=>`<tr><td>${date(o.created)}</td><td><b>${esc(o.code)}</b><div class="muted">${esc(o.title)}</div></td><td>${money(o.amount)}</td><td>${money(paid(o.id))}</td><td><b>${money(balance(o))}</b></td></tr>`).join(''))}</div><p style="text-align:right;font-size:19px"><b>TỔNG CÒN NỢ: ${money(sum)}</b></p><div class="hint">Bảng đối chiếu công nợ theo dữ liệu đã ghi nhận; vui lòng xác nhận nếu có sai lệch.</div><div class="foot"><button class="btn" onclick="exportStatement('${pid}')">Xuất Excel (CSV)</button><button class="btn primary" onclick="printStatement('${pid}')">In / Lưu PDF</button><button class="btn" onclick="closeModal()">Đóng</button></div>`);}
function exportStatement(pid){const p=partner(pid),os=state.orders.filter(o=>o.partnerId===pid&&balance(o)>0).sort((a,b)=>(a.created||'').localeCompare(b.created||''));csvFile('BangKeCongNo_'+p.name.replace(/[^\p{L}\p{N} _-]/gu,'')+'_'+today()+'.csv',[['TÙNG GIANG CNC - BẢNG ĐỐI CHIẾU CÔNG NỢ'],['Khách hàng',p.name],['Ngày đối chiếu',today()],[],['Ngày đơn','Mã đơn','Nội dung','Giá trị đơn','Đã thanh toán','Còn nợ'],...os.map(o=>[o.created,o.code,o.title,o.amount,paid(o.id),balance(o)]),[],['TỔNG CÒN NỢ','','','','',os.reduce((a,o)=>a+balance(o),0)]]);}
function printStatement(pid){const p=partner(pid),os=state.orders.filter(o=>o.partnerId===pid&&balance(o)>0).sort((a,b)=>(a.created||'').localeCompare(b.created||'')),sum=os.reduce((a,o)=>a+balance(o),0);const tr=os.map((o,i)=>`<tr><td>${i+1}</td><td>${date(o.created)}</td><td>${esc(o.code)}</td><td>${esc(o.title)}</td><td class="num">${money(o.amount)}</td><td class="num">${money(paid(o.id))}</td><td class="num">${money(balance(o))}</td></tr>`).join('');const doc=`<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Bảng kê công nợ - ${esc(p.name)}</title><style>body{font:13px Arial,sans-serif;color:#222;padding:24px}h1{text-align:center;font-size:22px;margin:24px 0 8px}p{margin:9px 0}table{border-collapse:collapse;width:100%;margin-top:18px}th,td{border:1px solid #888;padding:7px;text-align:left;vertical-align:top}th{background:#eee}.num{text-align:right;white-space:nowrap}.total{font-size:18px;text-align:right;margin-top:20px}.footnote{margin-top:24px;color:#555}.sign{display:flex;justify-content:space-between;text-align:center;margin-top:35px}@media print{@page{size:A4 landscape;margin:12mm}body{padding:0}}.customer-link{border:0;background:transparent;color:#1263a5;font-weight:700;text-align:left;padding:4px 0;text-decoration:underline;text-underline-offset:3px}.customer-link:hover{color:#0b426f}.detail-grid{margin-top:16px}@media(max-width:650px){.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}.stat.clickable{cursor:pointer;text-align:left;width:100%;font:inherit}.stat.clickable:hover{border-color:#1263a5;box-shadow:0 2px 10px #1263a51c}.suggest{display:block;width:100%;max-height:180px;overflow:auto;border:1px solid #d4deeb;border-radius:9px;background:#fff}.suggest button{display:block;width:100%;text-align:left;background:#fff;border:0;padding:10px;border-bottom:1px solid #eee}.suggest button:hover{background:#eaf4ff}.compactrow{padding:8px 0;border-bottom:1px solid #edf0f4}.sectionheading{display:flex;justify-content:space-between;align-items:center;gap:8px} .btn:focus-visible,.stat:focus-visible{outline:3px solid #5c9ed0}</style><link rel="manifest" href="./manifest.webmanifest"></head><body><b>TÙNG GIANG CNC</b><h1>BẢNG ĐỐI CHIẾU CÔNG NỢ</h1><p><b>Khách hàng:</b> ${esc(p.name)}</p><p><b>Ngày đối chiếu:</b> ${date(today())}</p><table><thead><tr><th>STT</th><th>Ngày đơn</th><th>Mã đơn</th><th>Nội dung</th><th>Giá trị</th><th>Đã trả</th><th>Còn nợ</th></tr></thead><tbody>${tr}</tbody></table><div class="total"><b>TỔNG CÒN NỢ: ${money(sum)}</b></div><p class="footnote">Kính đề nghị quý khách đối chiếu và xác nhận số dư. Nếu có sai lệch, vui lòng phản hồi để kiểm tra.</p><div class="sign"><div><b>ĐẠI DIỆN TÙNG GIANG CNC</b><p>(Ký, ghi rõ họ tên)</p></div><div><b>KHÁCH HÀNG XÁC NHẬN</b><p>(Ký, ghi rõ họ tên)</p></div></div></body></html>`;const w=window.open('','_blank');if(!w){alert('Trình duyệt đang chặn cửa sổ in. Hãy cho phép mở cửa sổ bật lên.');return;}w.document.open();w.document.write(doc);w.document.close();w.focus();setTimeout(()=>w.print(),350)}
function ordersTable(arr){return table(['Mã / Hạng mục','Đối tác','Giá trị','Đã thanh toán','Còn lại / Hạn','Thao tác'],arr.map(o=>`<tr><td><b>${esc(o.code)}</b><div class="muted">${esc(o.title)} ${o.cancelled?"(ĐÃ HỦY) ":""}${o.risk==="bad"?"⚠ Nợ khó thu hồi":""}</div></td><td>${esc(partner(o.partnerId)?.name||'—')}</td><td>${money(o.amount)}</td><td>${money(paid(o.id))}</td><td><b class="${due(o)?'red':''}">${money(balance(o))}</b><div class="muted">${date(o.due)} ${due(o)?'· QUÁ HẠN':''}</div></td><td><button class="smallbtn" onclick="formPayment(null,'${o.id}')">${partner(o.partnerId)?.type==='supplier'?'Chi':'Thu'}</button><button class="smallbtn" onclick="${partner(o.partnerId)?.type==='supplier'?`formEditSupplierOrder('${o.id}')`:`formOrder('${o.id}')`}">Sửa</button><button class="smallbtn danger" onclick="removeOrder('${o.id}')">Xóa</button><button class="smallbtn" onclick="cancelOrder('${o.id}')">${o.cancelled?'Đã hủy':'Hủy đơn'}</button></td></tr>`).join(''))}
function search(v){filter=v;const input=document.activeElement;const pos=input.selectionStart;render();const next=$('.search');next.focus();next.setSelectionRange(pos,pos)}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}
function foot(){return `<div class="foot"><button class="btn" type="button" onclick="closeModal()">Hủy</button><button class="btn primary" type="submit">Lưu</button></div>`}
function formPartner(pid,defaultType='customer'){const p=partner(pid)||{name:'',type:defaultType,phone:'',note:''};modal(pid?'Sửa thông tin':'Thêm khách / nhà cung cấp',`<form id="f" onsubmit="submitPartner(event,'${pid||''}')"><div class="fields"><label class="field wide">Tên khách hàng / nhà cung cấp<input name="name" required maxlength="150" value="${esc(p.name)}"></label><label class="field">Loại đối tác<select name="type"><option value="customer" ${p.type==='customer'?'selected':''}>Khách hàng</option><option value="supplier" ${p.type==='supplier'?'selected':''}>Nhà cung cấp</option></select></label><label class="field">Số điện thoại<input name="phone" value="${esc(p.phone)}"></label><label class="field wide">Ghi chú<textarea name="note">${esc(p.note)}</textarea></label></div>${foot()}</form>`)}
async function submitPartner(e,pid){e.preventDefault();const f=new FormData(e.target),p={id:pid||id(),name:f.get('name').trim(),type:f.get('type'),phone:f.get('phone').trim(),note:f.get('note').trim()};if(pid)state.partners=state.partners.map(x=>x.id===pid?p:x);else state.partners.push(p);closeModal();await commit()}
function normalizeName(v){return String(v||'').normalize('NFC').trim().replace(/\s+/g,' ').toLocaleLowerCase('vi')}
function suggestPartners(inputId,boxId,type){const q=document.getElementById(inputId)?.value||'',box=document.getElementById(boxId);if(!box)return;const candidates=state.partners.filter(p=>p.type===type&&normalizeName(p.name).includes(normalizeName(q))).slice(0,8);box.innerHTML=q&&candidates.length?candidates.map(p=>`<button type="button" onclick="document.getElementById('${inputId}').value=${JSON.stringify(p.name).replaceAll('"','&quot;')};document.getElementById('${boxId}').innerHTML='';">${esc(p.name)}</button>`).join(''):''}
function getOrCreatePartner(name,type){const n=normalizeName(name);let p=state.partners.find(p=>p.type===type&&normalizeName(p.name)===n);if(!p){p={id:id(),name:name.trim(),type,phone:'',note:'Tạo tự động khi nhập đơn/giao dịch'};state.partners.push(p)}return p}
function formOrder(oid){const o=order(oid)||{code:'TG-'+new Date().getFullYear()+'-'+String(state.orders.length+1).padStart(3,'0'),title:'',amount:'',created:today(),due:'',note:''};const old=partner(o.partnerId);modal(oid?'Sửa đơn khách':'Thêm đơn hàng khách',`<form onsubmit="submitOrder(event,'${oid||''}')"><div class="fields"><label class="field wide">Tên khách hàng (gõ tự do)<input id="orderCustomerName" name="customerName" autocomplete="off" required value="${esc(old?.name||'')}" oninput="suggestPartners('orderCustomerName','orderSuggest','customer')"><span id="orderSuggest" class="suggest"></span></label><label class="field">Mã đơn<input name="code" required value="${esc(o.code)}"></label><label class="field">Giá trị đơn (VNĐ)<input name="amount" type="number" min="0" step="1" required value="${esc(o.amount)}"></label><label class="field wide">Hạng mục / Nội dung<input name="title" required value="${esc(o.title)}"></label><label class="field">Ngày lập<input name="created" type="date" required value="${o.created}"></label><label class="field">Hạn thanh toán<input name="due" type="date" value="${o.due||''}"></label><label class="field wide">Ghi chú<textarea name="note">${esc(o.note)}</textarea></label></div>${foot()}</form>`)}
async function submitOrder(e,oid){e.preventDefault();const f=new FormData(e.target),name=f.get('customerName').trim();if(!name)return alert('Nhập tên khách');const amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<0)return alert('Số tiền không hợp lệ');const existing=oid?order(oid):null;if(existing&&existing.cancelled)return alert('Đơn đã hủy, không thể sửa.');if(existing&&amount<paid(oid))return alert('Giá trị đơn thấp hơn số đã thanh toán');const code=f.get('code').trim();if(state.orders.some(x=>x.id!==oid&&x.code===code))return alert('Mã đơn đã tồn tại');const pt=getOrCreatePartner(name,'customer'),o={...existing,id:oid||id(),partnerId:pt.id,code,title:f.get('title').trim(),amount,created:f.get('created'),due:f.get('due'),note:f.get('note').trim(),updatedAt:new Date().toISOString()};if(oid)state.orders=state.orders.map(x=>x.id===oid?o:x);else state.orders.push(o);closeModal();await commit()}
function formSupplierOrder(){modal('Ghi nhận nhập nợ nhà cung cấp',`<form onsubmit="submitSupplierOrder(event)"><div class="fields"><label class="field wide">Tên nhà cung cấp<input id="supplierName" name="supplierName" autocomplete="off" required oninput="suggestPartners('supplierName','supplierSuggest','supplier')"><span id="supplierSuggest" class="suggest"></span></label><label class="field wide">Nội dung hàng / vật tư<input name="title" required placeholder="Ván MDF, phụ kiện..."></label><label class="field">Giá trị nhập (VNĐ)<input name="amount" type="number" min="1" step="1" required></label><label class="field">Ngày nhập<input name="created" type="date" value="${today()}" required></label><label class="field wide">Ghi chú<input name="note"></label></div>${foot()}</form>`)}
function formEditSupplierOrder(oid){const o=order(oid);if(!o||partner(o.partnerId)?.type!=='supplier')return;if(o.cancelled)return alert('Đơn đã hủy');const p=partner(o.partnerId);modal('Sửa nhập nợ nhà cung cấp',`<form onsubmit="submitEditSupplierOrder(event,'${oid}')"><div class="fields"><label class="field wide">Nhà cung cấp<input value="${esc(p.name)}" disabled></label><label class="field wide">Nội dung<input name="title" required value="${esc(o.title)}"></label><label class="field">Giá trị (VNĐ)<input name="amount" type="number" min="0" step="1" required value="${o.amount}"></label><label class="field">Ngày nhập<input name="created" type="date" required value="${o.created}"></label><label class="field wide">Ghi chú<input name="note" value="${esc(o.note||'')}"></label></div>${foot()}</form>`)}
async function submitEditSupplierOrder(e,oid){e.preventDefault();const o=order(oid),f=new FormData(e.target),amount=Number(f.get('amount'));if(!o||o.cancelled)return;if(!Number.isFinite(amount)||amount<paid(oid))return alert('Giá trị không hợp lệ hoặc thấp hơn số đã trả');Object.assign(o,{title:f.get('title').trim(),amount,created:f.get('created'),note:f.get('note').trim(),updatedAt:new Date().toISOString()});closeModal();await commit()}
async function submitSupplierOrder(e){e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<=0)return alert('Giá trị không hợp lệ');const pt=getOrCreatePartner(f.get('supplierName'),'supplier');state.orders.push({id:id(),partnerId:pt.id,code:'NCC-'+Date.now(),title:f.get('title'),amount,created:f.get('created'),due:'',note:f.get('note'),updatedAt:new Date().toISOString()});closeModal();await commit()}
function formPayment(pid,selectedOrder){if(!state.orders.length)return toast('Hãy tạo đơn hàng trước');const p=state.payments.find(x=>x.id===pid)||{orderId:selectedOrder||state.orders[0].id,date:today(),amount:'',method:'Chuyển khoản',note:''};modal(pid?'Sửa giao dịch':'Ghi nhận thu / chi',`<form onsubmit="submitPayment(event,'${pid||''}')"><div class="fields"><label class="field wide">Đơn hàng<select name="orderId" id="payOrder" onchange="updatePayInfo()">${state.orders.filter(o=>balance(o)>0||o.id===p.orderId).sort((a,b)=>(partner(a.partnerId)?.name||'').localeCompare(partner(b.partnerId)?.name||'','vi')).map(o=>`<option value="${o.id}" ${o.id===p.orderId?'selected':''}>${esc(partner(o.partnerId)?.name)} · ${esc(o.code)} · ${esc(o.title)}</option>`).join('')}</select><span class="hint" id="payInfo"></span></label><label class="field">Số tiền (VNĐ)<input name="amount" type="number" min="1" step="any" required value="${esc(p.amount)}"></label><label class="field">Ngày giao dịch<input name="date" type="date" required value="${p.date}"></label><label class="field">Hình thức<select name="method">${['Chuyển khoản','Tiền mặt','Khác'].map(x=>`<option ${p.method===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field wide">Ghi chú / Nội dung chuyển khoản<textarea name="note">${esc(p.note)}</textarea></label></div>${foot()}</form>`);updatePayInfo()}
function updatePayInfo(){const o=order($('#payOrder').value);$('#payInfo').textContent=`${partner(o.partnerId)?.type==='customer'?'Thu từ khách':'Chi cho nhà cung cấp'} · Còn ${money(balance(o))}`}
async function submitPayment(e,pid){e.preventDefault();const f=new FormData(e.target),p={id:pid||id(),orderId:f.get('orderId'),date:f.get('date'),amount:num(f.get('amount')),method:f.get('method'),note:f.get('note').trim()};if(p.amount<=0)return alert('Số tiền phải lớn hơn 0');const o=order(p.orderId),existing=pid?state.payments.find(x=>x.id===pid):null,available=balance(o)+(existing?.orderId===p.orderId?existing.amount:0);if(p.amount>available)return alert('Số tiền vượt quá công nợ còn lại: '+money(available));p.updatedAt=new Date().toISOString();if(pid)state.payments=state.payments.map(x=>x.id===pid?p:x);else state.payments.push(p);closeModal();await commit()}
async function removePartner(pid){if(state.orders.some(o=>o.partnerId===pid))return alert('Đối tác đã có đơn hàng. Hãy xử lý các đơn liên quan trước.');if(confirm('Xóa đối tác này?')){state.partners=state.partners.filter(p=>p.id!==pid);await commit()}}
async function cancelOrder(oid){
 const o=order(oid);if(!o)return;
 if(o.cancelled)return alert('Đơn này đã hủy.');
 if(state.payments.some(p=>p.orderId===oid))return alert('Đơn đã có giao dịch thanh toán. Cần đối chiếu/hoàn tác giao dịch trước khi hủy.');
 if(!confirm('HỦY ĐƠN '+o.code+'? Đơn sẽ không còn tính vào công nợ nhưng vẫn lưu lịch sử.'))return;
 o.cancelled=true;o.cancelledAt=new Date().toISOString();o.updatedAt=o.cancelledAt;
 await commit();
}
async function removeOrder(oid){if(state.payments.some(p=>p.orderId===oid))return alert('Đơn đã có giao dịch. Hãy xử lý các giao dịch trước.');if(!confirm('XÓA VĨNH VIỄN đơn này? Hành động không thể hoàn tác. Nên Sao lưu JSON trước.'))return;if(!confirm('Xác nhận lần cuối: XÓA đơn '+(order(oid)?.code||'')+'?'))return;state.orders=state.orders.filter(o=>o.id!==oid);await commit()}
async function removePayment(pid){if(confirm('Xóa giao dịch? Công nợ sẽ được tính lại.')){state.payments=state.payments.filter(p=>p.id!==pid);await commit()}}
function formMultiPayment(){
 const customers=state.partners.filter(p=>p.type==='customer'&&state.orders.some(o=>o.partnerId===p.id&&balance(o)>0));
 if(!customers.length)return toast('Không có công nợ cần thu');
 modal('Thu tiền phân bổ nhiều đơn',`<form onsubmit="submitMultiPayment(event)"><div class="fields"><label class="field wide">Khách hàng<select id="multiCustomer" onchange="showMultiOrders()">${customers.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label class="field">Số tiền khách trả<input id="multiAmount" name="amount" type="number" min="1" step="any" required oninput="showMultiOrders()"></label><label class="field">Ngày thu<input name="date" type="date" value="${today()}" required></label><label class="field">Hình thức<select name="method"><option>Chuyển khoản</option><option>Tiền mặt</option><option>Khác</option></select></label><label class="field wide">Ghi chú<input name="note" placeholder="Nội dung thanh toán"></label></div><div id="multiOrders" style="margin-top:12px"></div><div class="hint">Tự động trừ theo đơn cũ nhất trước. Có thể chọn đơn để ưu tiên.</div>${foot()}</form>`);
 showMultiOrders();
}
function showMultiOrders(){
 const pid=$('#multiCustomer').value, amount=num($('#multiAmount').value);
 const os=state.orders.filter(o=>o.partnerId===pid&&balance(o)>0).sort((a,b)=>(a.created||'9999').localeCompare(b.created||'9999'));
 let left=amount;
 const tr=os.map(o=>{let alloc=Math.min(left,balance(o));left-=alloc;return `<tr><td><input type="checkbox" name="allocOrder" value="${o.id}" checked></td><td>${esc(o.code)}<div class="muted">${esc(o.title)}</div></td><td>${money(balance(o))}</td></tr>`}).join('');
 $('#multiOrders').innerHTML=`<div class="muted">${os.length} đơn còn nợ · Tổng ${money(os.reduce((a,o)=>a+balance(o),0))}</div>${table(['Chọn','Đơn','Còn nợ'],tr)}${left>0?`<div class="warn">Tiền nhập vượt số dư của khách: ${money(left)}</div>`:''}`;
}
async function submitMultiPayment(e){
 e.preventDefault();
 const f=new FormData(e.target), pid=$('#multiCustomer').value, amt=Number(f.get('amount'));
 if(!Number.isFinite(amt)||amt<=0)return alert('Số tiền không hợp lệ');
 const ids=f.getAll('allocOrder'), os=ids.map(order).filter(o=>o&&o.partnerId===pid&&balance(o)>0).sort((a,b)=>(a.created||'9999').localeCompare(b.created||'9999'));
 const available=os.reduce((a,o)=>a+balance(o),0);
 if(amt>available+0.001)return alert('Số tiền vượt tổng nợ các đơn đã chọn: '+money(available));
 if(!os.length)return alert('Chọn ít nhất một đơn');
 let left=amt, count=0, batch=id();
 for(const o of os){if(left<=0.001)break;const v=Math.min(left,balance(o));state.payments.push({id:id(),orderId:o.id,date:f.get('date'),amount:Math.round(v*100)/100,method:f.get('method'),note:(f.get('note')||'')+' · Phân bổ '+batch,updatedAt:new Date().toISOString()});left-=v;count++}
 closeModal();await commit();toast('Đã phân bổ thu tiền vào '+count+' đơn');
}
function recentActivity(){const items=[...state.orders.map(o=>({time:o.updatedAt||((o.created||'2022-01-01')+'T00:00:00'),kind:'Đơn hàng',pt:partner(o.partnerId),title:o.title,amount:o.amount,click:o.partnerId,orderId:o.id})),...state.payments.map(p=>{const o=order(p.orderId);return {time:p.updatedAt||((p.date||'2022-01-01')+'T12:00:00'),kind:partner(o?.partnerId)?.type==='supplier'?'Chi NCC':'Thu khách',pt:partner(o?.partnerId),title:o?.title||'',amount:p.amount,click:o?.partnerId,paymentId:p.id}})].sort((a,b)=>b.time.localeCompare(a.time)).slice(0,30);return table(['Ngày','Khách / NCC','Cập nhật','Số tiền','Thao tác'],items.map(x=>`<tr><td>${date(x.time.slice(0,10))}</td><td><button class="customer-link" onclick="${x.pt?.type==='supplier'?`openSupplier('${x.click}')`:`openCustomer('${x.click}')`}">${esc(x.pt?.name)}</button></td><td>${esc(x.kind)}<div class="muted">${esc(x.title)}</div></td><td>${money(x.amount)}</td><td>${x.orderId?orderActions(order(x.orderId)):`<button class="smallbtn" onclick="formPayment('${x.paymentId}')">Sửa thu/chi</button><button class="smallbtn danger" onclick="removePayment('${x.paymentId}')">Xóa thu/chi</button>`}</td></tr>`).join(''))}
function openSupplier(pid){selectedCustomer=pid;current='supplier-detail';render()}
function supplierListView(){const ps=state.partners.filter(p=>p.type==='supplier').map(p=>({...p,amount:state.orders.filter(o=>o.partnerId===p.id).reduce((a,o)=>a+balance(o),0)})).filter(p=>p.amount>0).sort((a,b)=>b.amount-a.amount);return `<div class="panel"><div class="split"><h2>Nhà cung cấp còn nợ (${ps.length})</h2><button class="btn" onclick="tab('dashboard')">← Tổng quan</button></div>${table(['Nhà cung cấp','Còn nợ','Chi tiết'],ps.map(p=>`<tr><td><button class="customer-link" onclick="openSupplier('${p.id}')">${esc(p.name)}</button></td><td>${money(p.amount)}</td><td><button class="smallbtn" onclick="openSupplier('${p.id}')">Xem</button></td></tr>`).join(''))}</div>`}
function supplierDetailView(pid){const p=partner(pid);if(!p)return 'Không tìm thấy NCC';const os=state.orders.filter(o=>o.partnerId===pid),month=today().slice(0,7),old=os.filter(o=>(o.created||'').slice(0,7)<month).reduce((a,o)=>a+balance(o),0),newOrders=os.filter(o=>(o.created||'').slice(0,7)===month),newTotal=newOrders.reduce((a,o)=>a+o.amount,0),monthPaid=state.payments.filter(x=>x.date?.slice(0,7)===month&&order(x.orderId)?.partnerId===pid).reduce((a,x)=>a+x.amount,0),totalDebt=os.reduce((a,o)=>a+balance(o),0);return `<div class="panel"><div class="split"><h2>${esc(p.name)}</h2><div class="actions"><button class="btn" onclick="tab('supplier-debts')">← Nhà cung cấp</button><button class="btn primary" onclick="formSupplierPay('${pid}')">+ Trả tiền</button><button class="btn" onclick="printSupplier('${pid}')">In / Lưu PDF</button></div></div><div class="grid detail-grid"><div class="stat"><span>Dư nợ từ trước tháng ${month}</span><strong>${money(old)}</strong></div><div class="stat"><span>Nhập mới tháng này</span><strong>${money(newTotal)}</strong></div><div class="stat"><span>Đã trả tháng này</span><strong>${money(monthPaid)}</strong></div><div class="stat"><span>Tổng còn nợ</span><strong>${money(totalDebt)}</strong></div></div><h3>Danh sách nhập tháng ${month}</h3>${table(['Ngày','Nội dung','Giá trị','Còn lại','Thao tác'],newOrders.map(o=>`<tr><td>${date(o.created)}</td><td>${esc(o.title)}</td><td>${money(o.amount)}</td><td>${money(balance(o))}</td><td>${orderActions(o)}</td></tr>`).join(''))}<h3>Tất cả đơn nhập nhà cung cấp</h3>${table(['Ngày','Nội dung','Giá trị','Còn lại','Thao tác'],os.map(o=>`<tr><td>${date(o.created)}</td><td>${esc(o.title)} ${o.cancelled?'(Đã hủy)':''}</td><td>${money(o.amount)}</td><td>${money(balance(o))}</td><td>${orderActions(o)}</td></tr>`).join(''))}<p class="hint">Dư nợ cũ được chuyển tiếp tự động theo số dư, không tạo khoản nợ trùng. Khoản trả NCC được trừ theo các đơn nhập cũ nhất.</p></div>`}
function printSupplier(pid){const p=partner(pid),os=state.orders.filter(o=>o.partnerId===pid&&balance(o)>0);const win=window.open('','_blank');if(!win)return alert('Cho phép mở cửa sổ để in');win.document.write(`<html><meta charset="utf-8"><title>Đối chiếu NCC</title><style>body{font:14px Arial;padding:24px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:8px;text-align:left}</style><h2>TÙNG GIANG CNC – ĐỐI CHIẾU CÔNG NỢ NCC</h2><p>Nhà cung cấp: ${esc(p.name)} · Ngày: ${date(today())}</p><table><tr><th>Ngày</th><th>Nội dung</th><th>Còn nợ</th></tr>${os.map(o=>`<tr><td>${date(o.created)}</td><td>${esc(o.title)}</td><td>${money(balance(o))}</td></tr>`).join('')}</table><h3>Tổng còn nợ: ${money(os.reduce((a,o)=>a+balance(o),0))}</h3></html>`);win.document.close();win.print()}
function formCustomerReceipt(){modal('Thu tiền khách hàng',`<div class="fields"><label class="field wide">Gõ tên khách hàng<input id="receiptCustomer" autocomplete="off" oninput="suggestReceiptCustomers()" placeholder="Nhập tên để tìm nhanh..."><span id="receiptSuggestions" class="suggest"></span></label></div><p class="hint">Chọn khách để xem các đơn còn nợ, thu một đơn hoặc phân bổ nhiều đơn.</p>`)}
function suggestReceiptCustomers(){const q=normalizeName($('#receiptCustomer').value);const ps=state.partners.filter(p=>p.type==='customer'&&normalizeName(p.name).includes(q)&&state.orders.some(o=>o.partnerId===p.id&&balance(o)>0)).slice(0,15);$('#receiptSuggestions').innerHTML=ps.map(p=>`<button onclick="closeModal();formMultiPaymentFor('${p.id}')">${esc(p.name)} · ${money(state.orders.filter(o=>o.partnerId===p.id).reduce((a,o)=>a+balance(o),0))}</button>`).join('')}
function formSupplierPay(pid){const ps=state.partners.filter(p=>p.type==='supplier'&&state.orders.some(o=>o.partnerId===p.id&&balance(o)>0));if(!ps.length)return toast('Chưa có nợ nhà cung cấp');modal('Chi trả nhà cung cấp',`<form onsubmit="submitSupplierPay(event)"><div class="fields"><label class="field wide">Nhà cung cấp<select name="supplierId" id="supplierPaySelect" onchange="updateSupplierPayBalance()">${ps.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select><span id="supplierPayBalance" class="hint"></span></label><label class="field">Số tiền trả<input name="amount" type="number" min="1" step="1" required></label><label class="field">Ngày trả<input name="date" type="date" value="${today()}" required></label><label class="field">Hình thức<select name="method"><option>Chuyển khoản</option><option>Tiền mặt</option><option>Khác</option></select></label><label class="field wide">Ghi chú<input name="note"></label></div>${foot()}</form>`);updateSupplierPayBalance()}
function updateSupplierPayBalance(){const pid=$('#supplierPaySelect').value;$('#supplierPayBalance').textContent='Tổng còn nợ: '+money(state.orders.filter(o=>o.partnerId===pid).reduce((a,o)=>a+balance(o),0))}
async function submitSupplierPay(e){e.preventDefault();const f=new FormData(e.target),pid=f.get('supplierId'),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<=0)return alert('Số tiền không hợp lệ');const os=state.orders.filter(o=>o.partnerId===pid&&balance(o)>0).sort((a,b)=>(a.created||'').localeCompare(b.created||'')),total=os.reduce((a,o)=>a+balance(o),0);if(amount>total+0.001)return alert('Số tiền vượt tổng nợ: '+money(total));let remaining=amount;const batch=id();for(const o of os){if(remaining<=0.001)break;const v=Math.min(remaining,balance(o));state.payments.push({id:id(),orderId:o.id,date:f.get('date'),amount:v,method:f.get('method'),note:(f.get('note')||'')+' · Chi NCC '+batch,updatedAt:new Date().toISOString()});remaining-=v}closeModal();await commit()}
async function resetMigration(){
 if(!confirm('Nạp lại toàn bộ dữ liệu công nợ cũ? Dữ liệu hiện tại sẽ bị THAY THẾ. Hãy bấm Sao lưu trước khi tiếp tục.'))return;
 if(!confirm('Xác nhận lần cuối: thay thế toàn bộ dữ liệu bằng bản chuyển tiếp từ Excel?'))return;
 state=structuredClone(MIGRATION);await commit();
}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportData(){download('TungGiang_CongNo_Backup_'+today()+'.json',JSON.stringify({app:'TungGiang-CongNo',version:1,exportedAt:new Date().toISOString(),data:state},null,2),'application/json');toast('Đã tạo tệp sao lưu')}
async function importData(e){const file=e.target.files[0];if(!file)return;try{const v=JSON.parse(await file.text());if(v.app!=='TungGiang-CongNo'||!v.data||!['partners','orders','payments'].every(k=>Array.isArray(v.data[k])))throw Error('Tệp không đúng định dạng');if(!confirm('Khôi phục sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Bạn đã sao lưu dữ liệu hiện tại chưa?'))return;state=v.data;await commit();toast('Khôi phục thành công')}catch(err){alert('Không thể nhập: '+err.message)}finally{e.target.value=''}}
function exportCSV(){const rows=[['Mã đơn','Đối tác','Loại','Hạng mục','Giá trị','Đã thanh toán','Còn lại','Hạn thanh toán'],...state.orders.map(o=>[o.code,partner(o.partnerId)?.name||'',partner(o.partnerId)?.type==='customer'?'Phải thu':'Phải trả',o.title,o.amount,paid(o.id),balance(o),o.due])];const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download('TungGiang_CongNo_'+today()+'.csv',csv,'text/csv;charset=utf-8')}
